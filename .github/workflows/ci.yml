name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} 构建+单测
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: linux-gcc-release, qt-arch: linux_gcc_64 }
          - { os: windows-2022, preset: windows-msvc2022-release, qt-arch: win64_msvc2022_64,
              aqt-src: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e' }
          - { os: macos-14, preset: macos-clang-release, qt-arch: clang_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: 拉取子模块（SSH → https 重写；gitcode 带令牌）
        shell: bash
        env:
          GITCODE_PAT: ${{ secrets.GITCODELIBSSH2 }}
        run: |
          set -e
          trap 'git config --global --unset url."https://oauth2:${GITCODE_PAT}@gitcode.com/".insteadOf || true' EXIT
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://oauth2:${GITCODE_PAT}@gitcode.com/".insteadOf "git@gitcode.com:"
          git submodule update --init --recursive

      # Qt 服务器 windows_x86 侧元数据有缺口：Updates.xml.sha256 确定性 404，
      # 且聚合目录 qt6_6111/qt6_6111/Updates.xml 不存在（仅有按架构子目录），
      # aqt 3.3.0 两条都视为致命；上游 3.3.0 之后已修复（缺聚合 XML 时回退按
      # 架构目录），故 Windows 用 aqtsource 固定到上游 master 提交。linux/mac
      # 元数据完整，继续用稳定的 3.3.x 发行版。
      - name: 安装 Qt 6.11.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: ${{ matrix.qt-arch }}
          modules: 'qtmultimedia'
          aqtsource: ${{ matrix.aqt-src }}
          aqtversion: '==3.3.*'

      - name: 导出 QT_ROOT（由 Qt6_DIR 推前缀）
        shell: bash
        run: echo "QT_ROOT=${Qt6_DIR%/lib/cmake/Qt6}" >> "$GITHUB_ENV"

      - name: Linux 测试依赖（offscreen GUI）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libdbus-1-dev

      - name: macOS OpenSSL 回退（vendored bundle 无 macOS 产物）
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      # vendored bundle 的 Windows 产物未构建完整（static/shared 均缺
      # include/ 与库文件），回退 runner 自带 OpenSSL 3.x（openssl/include
      # 存在即认定），并把其 bin 加入 PATH 供测试进程加载 DLL。
      - name: Windows OpenSSL 回退（vendored bundle Windows 产物不完整）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for d in "/c/Program Files/OpenSSL" "/c/Program Files/OpenSSL-Win64"; do
            if [ -f "${d}/include/openssl/ssl.h" ]; then
              echo "OPENSSL_ROOT_DIR=$(cygpath -w "${d}")" >> "$GITHUB_ENV"
              # GITHUB_PATH 条目会被原样追加进 Windows 原生 PATH，必须是
              # Windows 风格路径；gitbash 风格 /c/... 对测试进程无效
              echo "$(cygpath -w "${d}/bin")" >> "$GITHUB_PATH"
              echo "OpenSSL 回退：${d}"
              exit 0
            fi
          done
          echo "未找到 runner 自带 OpenSSL" >&2
          exit 1

      - name: 配置与构建
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      # -LE perf：perf 标签程序的吞吐阈值面向开发机标定（如冷存储 50 万行/秒），
      # CI runner 实测偏低（ubuntu 38 万 / macOS 48 万行/秒），按预案排除；
      # perf 由 nightly perf.yml 在专用 runner 上承接。
      - name: 主仓单测（45 程序基线，-LE perf 后 35 程序）
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        # Windows 上 ctest --output-on-failure 对“进程直接退出（如
        # STATUS_DLL_NOT_FOUND 0xc0000135）”这类失败不打印子进程输出；
        # 且 GitHub Actions Windows runner 会丢弃 ctest 孙进程的终端输出
        # （actions/runner#1206），LastTest.log 的 Output 段也为空。
        # 兜底打印 LastTest.log + 每个测试的 .qtest.log（QTest -o 文件输出，
        # 不经控制台代理，必然有内容）。
        run: |
          ctest --preset ${{ matrix.preset }} -LE perf || {
            echo "===== LastTest.log ====="
            cat "build/${{ matrix.preset }}/Testing/Temporary/LastTest.log" 2>/dev/null || true
            echo "===== QTest 文件输出 ====="
            find "build/${{ matrix.preset }}/tests" -name '*.qtest.log' -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; 2>/dev/null || true
            exit 1
          }

      # 0xc0000135（STATUS_DLL_NOT_FOUND）时 ctest/LastTest.log 都不含缺失 DLL 名，
      # 用 dumpbin 沿静态导入链逐级解析依赖，按加载器搜索顺序定位缺失项。
      - name: Windows 依赖诊断（仅失败时，定位缺失 DLL）
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_DIR: build/${{ matrix.preset }}
        run: |
          $ErrorActionPreference = 'Continue'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { Write-Host '未找到 dumpbin，跳过依赖诊断'; exit 0 }
          $searchDirs = @($env:SystemRoot + '\System32', $env:SystemRoot) + $env:Path.Split(';')
          function Resolve-Dll([string]$name, [string]$exeDir) {
              foreach ($d in @($exeDir) + $searchDirs) {
                  if ($d -and (Test-Path (Join-Path $d $name))) { return $true }
              }
              return $false
          }
          function Get-Deps([string]$pe) {
              & $dumpbin /DEPENDENTS $pe 2>$null |
                  Select-String -Pattern '^\s+(\S+\.dll)\s*$' |
                  ForEach-Object { $_.Matches[0].Groups[1].Value }
          }
          $exes = Get-ChildItem -Recurse -Filter *.exe "${env:BUILD_DIR}\tests" | Where-Object Name -like 'tst_*'
          foreach ($exe in $exes) {
              $visited = @{}
              $queue = [System.Collections.Generic.Queue[string]]::new()
              $exeDir = $exe.DirectoryName
              foreach ($d in Get-Deps $exe.FullName) { $queue.Enqueue($d) }
              $missing = @()
              while ($queue.Count -gt 0) {
                  $dll = $queue.Dequeue()
                  if ($visited.ContainsKey($dll)) { continue }
                  $visited[$dll] = $true
                  if (Resolve-Dll $dll $exeDir) {
                      foreach ($d in $searchDirs) {
                          $p = Join-Path $d $dll
                          if ($d -and (Test-Path $p)) { foreach ($x in Get-Deps $p) { $queue.Enqueue($x) }; break }
                      }
                  } else {
                      $missing += $dll
                  }
              }
              if ($missing.Count -gt 0) {
                  Write-Host ("===== {0} 缺失依赖: {1}" -f $exe.Name, ($missing -join ', '))
              }
          }
          Write-Host '依赖诊断完成（未列出程序 = 静态依赖均可解析）'

  zzsshcore:
    name: ZzSshCore 单测 + docker 集成
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: 拉取子模块（SSH → https 重写；gitcode 带令牌）
        shell: bash
        env:
          GITCODE_PAT: ${{ secrets.GITCODELIBSSH2 }}
        run: |
          set -e
          trap 'git config --global --unset url."https://oauth2:${GITCODE_PAT}@gitcode.com/".insteadOf || true' EXIT
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://oauth2:${GITCODE_PAT}@gitcode.com/".insteadOf "git@gitcode.com:"
          git submodule update --init --recursive

      - name: 安装 Qt 6.11.1（qtbase 即可）
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: linux_gcc_64
          aqtversion: '==3.3.*'

      - name: 集成测试依赖（Xvfb / xdpyinfo）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils

      - name: 库构建 + 单测（18 程序）
        working-directory: third_party/ZzSshCore
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release
          ctest --test-dir build/linux-release -L unit --output-on-failure

      - name: docker 集成（integration 标签，12 项）
        working-directory: third_party/ZzSshCore
        env:
          ZZSSH_IT_LABELS: integration
        run: tests/integration/docker/run-integration-tests.sh build/linux-release

name: Continuous Build

on:
  workflow_dispatch:
  schedule:
    # 每天东八区 0:00（UTC 16:00）构建主分支快照。GitHub 定时任务在高峰
    # 时段可能延迟几分钟到半小时，不保证准点。
    - cron: '0 16 * * *'

permissions:
  contents: read

concurrency:
  group: continuous-build
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # GitCode 的 HTTP 重定向会让 cargo 内置的 git2 传输在 Windows runner 上失败，
  # 改用系统 git 命令拉取 git 依赖。
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  SNAPSHOT_TAG: continuous-build

jobs:
  prepare:
    name: Resolve main and version
    runs-on: ubuntu-24.04
    # 只解析提交与版本；源码级检查已经移进 build-native.yml。
    timeout-minutes: 15
    outputs:
      main_sha: ${{ steps.metadata.outputs.main_sha }}
      version: ${{ steps.version.outputs.version }}
      preview: ${{ steps.version.outputs.preview }}
      changed: ${{ steps.metadata.outputs.changed }}
    steps:
      - name: Resolve main commit
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/master | awk '{print $1}')"
          [[ -n "${main_sha}" ]] || { echo 'failed to resolve master' >&2; exit 1; }
          # The tag alone is not a completion marker: creating a release may
          # create it before all assets have been uploaded and verified.
          changed='true'
          if [[ "${GITHUB_EVENT_NAME}" == 'schedule' ]]; then
            snapshot_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SNAPSHOT_TAG}" --jq '.object.sha' 2>/dev/null || true)"
            snapshot_notes="$(gh release view "${SNAPSHOT_TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body // ""' 2>/dev/null || true)"
            verified_marker="<!-- zzclawterm-snapshot-verified:${main_sha} -->"
            if [[ "${snapshot_sha}" == "${main_sha}" && "${snapshot_notes}" == *"${verified_marker}"* ]]; then
              changed='false'
              echo "master is unchanged since the last snapshot (${main_sha}); skipping."
            fi
          fi
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Checkout main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.metadata.outputs.main_sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Resolve workspace version
        id: version
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          # 只有预发布版本号才会走预览通道：正式版本号的快照和正式发布是同一个
          # 版本，客户端只会去读稳定通道的清单，发预览清单反而会让更旧的预览版
          # 本看到一条装不上的更新。
          case "${version}" in
            *-*) echo "preview=true" >> "${GITHUB_OUTPUT}" ;;
            *) echo "preview=false" >> "${GITHUB_OUTPUT}" ;;
          esac

  build:
    name: Build snapshot packages
    needs: prepare
    # 当前提交已有校验完成的快照时跳过，源码级检查也随之跳过。
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/build-native.yml
    with:
      source_sha: ${{ needs.prepare.outputs.main_sha }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish main snapshot
    needs: [prepare, build]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.main_sha }}
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Validate snapshot assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          python3 scripts/ci/check_release_assets.py --dist release-assets
          --version "${VERSION}"
      - name: Write snapshot release notes
        shell: bash
        env:
          MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Rolling snapshot of the master branch, rebuilt daily at 00:00 (UTC+8) when master has new commits, or on manual dispatch.

          Source commit: ${MAIN_SHA}

          This prerelease is overwritten after every successful snapshot build and is intended for testing only.
          EOF
      - name: Install Node.js
        if: needs.prepare.outputs.preview == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install signature verification tool
        if: needs.prepare.outputs.preview == 'true'
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Prepare updater signing key
        if: needs.prepare.outputs.preview == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_B64:-}" || -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]; then
            echo 'Tauri updater signing key and password are required' >&2
            exit 1
          fi
          key_text="$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY_B64}" | base64 --decode)"
          delimiter="TAURI_KEY_$(openssl rand -hex 12)"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<${delimiter}"
            printf '%s\n' "${key_text}"
            echo "${delimiter}"
          } >> "${GITHUB_ENV}"
      - name: Sign updater artifacts
        if: needs.prepare.outputs.preview == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_UPDATER_PUBLIC_KEY_B64: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IENBM0E2Mzg3MzNGOUM3MDYKUldRR3gva3poMk02eXFGbGhobkVuaFVCZ0V2bnFheFRGQVlnVS9pSmFxRGc4WXNaMmZYeUZOM1cK
        run: |
          set -euo pipefail
          printf '%s' "${TAURI_UPDATER_PUBLIC_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/zzclawterm-updater.pub"
          files=(
            "release-assets/ZzClawTerm_${VERSION}_macos_arm64.app.tar.gz"
            "release-assets/ZzClawTerm_${VERSION}_macos_x64.app.tar.gz"
            "release-assets/ZzClawTerm_${VERSION}_linux_arm64.AppImage"
            "release-assets/ZzClawTerm_${VERSION}_linux_x64.AppImage"
            "release-assets/ZzClawTerm_${VERSION}_windows_arm64-setup.exe"
            "release-assets/ZzClawTerm_${VERSION}_windows_x64-setup.exe"
          )
          for file in "${files[@]}"; do
            npx --yes @tauri-apps/cli@2.10.0 signer sign --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" "${file}"
            # tauri signer 的 .sig 是 base64 包裹的整体 blob，正是 latest.json 的
            # signature 字段需要的形态；解码出标准 minisign 副本用于校验。
            base64 --decode "${file}.sig" > "${RUNNER_TEMP}/verify.sig"
            minisign -Vm "${file}" -p "${RUNNER_TEMP}/zzclawterm-updater.pub" -x "${RUNNER_TEMP}/verify.sig"
          done
      - name: Generate checksums and update manifest
        if: needs.prepare.outputs.preview == 'true'
        shell: bash
        env:
          BASE_URL: https://github.com/${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release/generate_release_metadata.py \
            --dist release-assets --version "${VERSION}" --tag "${SNAPSHOT_TAG}" \
            --base-url "${BASE_URL}" --notes-file release-notes.md \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          rm -- release-assets/*.sig
      - name: Report a snapshot without preview channel
        if: needs.prepare.outputs.preview != 'true'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "::notice::snapshot version ${VERSION} is not a prerelease, so no preview update manifest is published"
      - name: Create or update snapshot release
        id: snapshot_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
        run: |
          set -euo pipefail
          if gh release view "${SNAPSHOT_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'existing=true' >> "${GITHUB_OUTPUT}"
            gh release edit "${SNAPSHOT_TAG}" --repo "${GITHUB_REPOSITORY}" --title 'Continuous Build' --notes-file release-notes.md --prerelease
            while IFS= read -r asset; do
              [[ -z "${asset}" ]] || gh release delete-asset "${SNAPSHOT_TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}" --yes
            done < <(gh release view "${SNAPSHOT_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          else
            echo 'existing=false' >> "${GITHUB_OUTPUT}"
            gh release create "${SNAPSHOT_TAG}" --repo "${GITHUB_REPOSITORY}" --target "${MAIN_SHA}" --title 'Continuous Build' --notes-file release-notes.md --prerelease
          fi
          gh release upload "${SNAPSHOT_TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
      - name: Verify uploaded snapshot assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci/verify_remote_assets.py
          --tag "${SNAPSHOT_TAG}" --directory release-assets
      - name: Move snapshot tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SNAPSHOT_TAG}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${SNAPSHOT_TAG}" -f sha="${MAIN_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${SNAPSHOT_TAG}" -f sha="${MAIN_SHA}" >/dev/null
          fi
      - name: Refresh snapshot publication date
        if: steps.snapshot_release.outputs.existing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci/refresh_snapshot_release.py
          --repo "${GITHUB_REPOSITORY}" --tag "${SNAPSHOT_TAG}"
      - name: Mark snapshot complete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
        run: |
          set -euo pipefail
          printf '\n<!-- zzclawterm-snapshot-verified:%s -->\n' "${MAIN_SHA}" >> release-notes.md
          gh release edit "${SNAPSHOT_TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file release-notes.md

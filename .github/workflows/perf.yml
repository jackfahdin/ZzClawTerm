name: perf

on:
  schedule:
    - cron: '17 19 * * *'  # UTC 每日 19:17（北京时间次日 03:17），全量 perf 门控
  workflow_dispatch:

# schedule/dispatch 不互相取消：进行中的门控跑完再说，避免并行 perf 互染吞吐
concurrency:
  group: perf-nightly
  cancel-in-progress: false

# CI 专用滚动基线：先清掉仓库自带的本机校准 records（维护者机器基线，CI runner
# 性能异构不可用），再下载上一轮 nightly 自产的 records artifact 覆盖到 records 目录；
# 跑完把新 records 回传，下一轮对本轮自比。首轮无 artifact 时测试 QSKIP 自动采集
# 基线（不门控、退出码 0），上传后自愈。吞吐阈值判断仍由 run-integration-tests.sh
# 依仓库内阈值执行。
jobs:
  perf:
    name: ZzSshCore 全量 integration + perf 门控
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: 拉取子模块（SSH → https 重写；gitcode 带令牌）
        shell: bash
        env:
          GITCODE_PAT: ${{ secrets.GITCODELIBSSH2 }}
        run: |
          set -e
          trap 'git config --global --unset url."https://oauth2:${GITCODE_PAT}@gitcode.com/".insteadOf || true' EXIT
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://oauth2:${GITCODE_PAT}@gitcode.com/".insteadOf "git@gitcode.com:"
          git submodule update --init --recursive

      - name: 安装 Qt 6.11.1（qtbase 即可）
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: linux_gcc_64
          aqtversion: '==3.3.*'

      - name: 集成测试依赖（Xvfb / xdpyinfo）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils

      # 构建库本体（单测已由 ci.yml 的 zzsshcore job 门控，此处只构建）
      - name: 库构建
        working-directory: third_party/ZzSshCore
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release

      # 仓库跟踪的 records 是维护者本机校准基线，CI runner 性能异构不可用
      # （本机基线会把首轮 SFTP 吞吐误判为回归）；清空后若上轮 artifact 存在，
      # 由下载步恢复 CI 基线，首轮无 artifact 则测试 QSKIP 采集本 runner 基线
      - name: 准备 records 目录（清掉仓库自带的本机基线）
        shell: bash
        run: rm -f third_party/ZzSshCore/tests/perf/records/*.json

      - name: 下载上一轮 CI 滚动基线（records）
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true  # 首轮无该 artifact：测试 QSKIP 自动采集基线，不门控
        with:
          workflow: perf.yml
          workflow_conclusion: success
          name: perf-records-baseline
          path: third_party/ZzSshCore/tests/perf/records/

      # 不传 ZZSSH_IT_LABELS 即全量：integration + perf（含 WAN 三档），
      # 全程约 40-80 分钟，超快门禁 CI 的覆盖范围，由本 nightly 承接。
      - name: 全量集成 + perf（integration|perf 门控）
        working-directory: third_party/ZzSshCore
        env:
          # 库侧 tst_ZzSftpPerf::opensshBaseline 的开关：跳过与 CI runner 异构的
          # OpenSSH 本机基线对比（CI 滚动基线由下载步恢复，selftest 自备基线）
          ZZSSH_PERF_SKIP_OPENSSH_BASELINE: '1'
        run: tests/integration/docker/run-integration-tests.sh build/linux-release

      - name: 上传 CI 滚动基线（供下一轮门控）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-records-baseline
          # 测试异常退出时 records 可能缺失/不完整，不阻塞工作流（诊断 artifact 仍会报错暴露）
          if-no-files-found: warn
          path: third_party/ZzSshCore/tests/perf/records/*.json

      - name: 上传 perf 记录与 LastTest.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-records-${{ github.run_id }}
          # 门控 job 必需产物：缺失（如 perf 进程异常退出未落盘）直接报错，便于排查
          if-no-files-found: error
          path: |
            third_party/ZzSshCore/build/linux-release/Testing/Temporary/LastTest.log
            third_party/ZzSshCore/tests/perf/records/*.json
          retention-days: 30

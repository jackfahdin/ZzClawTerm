name: Publish GitCode Release

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.0.1
        required: true
        type: string
      upload_small_assets:
        description: Upload assets within the configured GitCode size limit
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: gitcode-release-${{ github.event.workflow_run.id || inputs.tag || github.run_id }}
  cancel-in-progress: false

env:
  GITCODE_API_BASE: ${{ vars.GITCODE_API_BASE || 'https://gitcode.com/api/v5' }}
  GITCODE_OWNER: ${{ vars.GITCODE_OWNER }}
  GITCODE_REPO: ${{ vars.GITCODE_REPO }}
  MAX_GITCODE_ASSET_MB: ${{ vars.MAX_GITCODE_ASSET_MB || '99' }}

jobs:
  publish:
    name: Mirror GitHub release to GitCode
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            tag="${INPUT_TAG}"
            [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
              echo "invalid release tag: ${tag}" >&2
              exit 1
            }
            publish='true'
          else
            tag="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v*' | awk -v sha="${HEAD_SHA}" '$1 == sha {sub(/^refs\/tags\//, "", $2); sub(/\^\{\}$/, "", $2); print $2}' | sort -V | tail -n 1)"
            publish='true'
            [[ -n "${tag}" ]] || publish='false'
          fi
          {
            echo "publish=${publish}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Skip run without a release tag
        if: steps.release.outputs.publish != 'true'
        run: echo 'The completed Release run did not publish a version tag.'

      - name: Check mirror configuration
        if: steps.release.outputs.publish == 'true'
        id: config
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail
          configured='true'
          for name in GITCODE_OWNER GITCODE_REPO GITCODE_API_BASE GITCODE_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::notice::${name} is not configured; skipping the GitCode mirror."
              configured='false'
            fi
          done
          if [[ "${configured}" == 'true' && ! "${MAX_GITCODE_ASSET_MB}" =~ ^[0-9]+$ ]]; then
            echo 'MAX_GITCODE_ASSET_MB must be an integer' >&2
            exit 1
          fi
          echo "configured=${configured}" >> "${GITHUB_OUTPUT}"

      - name: Ensure the tag exists on GitCode
        if: steps.release.outputs.publish == 'true' && steps.config.outputs.configured == 'true'
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          public_remote="https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}.git"
          if git ls-remote --exit-code "${public_remote}" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists on GitCode"
            exit 0
          fi
          # No checkout in this job: build a minimal repo holding just the tag
          # and push it ourselves instead of waiting on an external mirror sync.
          work="${RUNNER_TEMP}/gitcode-tag"
          git init -q "${work}"
          git -C "${work}" fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}:refs/tags/${TAG}"
          git -C "${work}" push -q "https://${GITCODE_OWNER}:${GITCODE_TOKEN}@gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}.git" "refs/tags/${TAG}:refs/tags/${TAG}"
          rm -rf "${work}"
          echo "pushed tag ${TAG} to GitCode"

      - name: Download and verify GitHub assets
        if: steps.release.outputs.publish == 'true' && steps.config.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir release-assets
          for _ in {1..12}; do
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,name,body,isPrerelease,targetCommitish > github-release.json && \
               gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-assets --clobber; then
              break
            fi
            sleep 10
          done
          test -f release-assets/SHA256SUMS
          (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Install Python dependencies
        if: steps.release.outputs.publish == 'true' && steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/gitcode-release-venv"
          "${RUNNER_TEMP}/gitcode-release-venv/bin/pip" install --disable-pip-version-check 'requests==2.32.5'

      - name: Create or update GitCode release
        if: steps.release.outputs.publish == 'true' && steps.config.outputs.configured == 'true'
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          UPLOAD_SMALL_ASSETS: ${{ inputs.upload_small_assets || 'true' }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitcode-release-venv/bin/python" <<'PY'
          import json
          import mimetypes
          import os
          import pathlib
          import sys
          import time
          import urllib.parse

          import requests

          tag = os.environ["TAG"]
          owner = os.environ["GITCODE_OWNER"]
          repo = os.environ["GITCODE_REPO"]
          api = os.environ["GITCODE_API_BASE"].rstrip("/")
          token = os.environ["GITCODE_TOKEN"]
          max_bytes = int(os.environ["MAX_GITCODE_ASSET_MB"]) * 1024 * 1024
          upload_small = os.environ.get("UPLOAD_SMALL_ASSETS", "true").lower() == "true"
          github = json.loads(pathlib.Path("github-release.json").read_text(encoding="utf-8"))
          assets = sorted(pathlib.Path("release-assets").iterdir(), key=lambda path: path.name.lower())
          session = requests.Session()

          def request(method, path, *, expected=(200, 201), allow_404=False, **kwargs):
              params = kwargs.pop("params", {})
              params["access_token"] = token
              response = session.request(method, f"{api}{path}", params=params, timeout=300, **kwargs)
              if allow_404 and response.status_code == 404:
                  return None
              if response.status_code not in expected:
                  print(f"::error::GitCode API {method} {path}: HTTP {response.status_code}")
                  print(response.text[:3000])
                  sys.exit(1)
              return response.json() if response.text.strip() else None

          owner_q = urllib.parse.quote(owner, safe="")
          repo_q = urllib.parse.quote(repo, safe="")
          tag_q = urllib.parse.quote(tag, safe="")
          release_path = f"/repos/{owner_q}/{repo_q}/releases"
          existing = request("GET", f"{release_path}/tags/{tag_q}", expected=(200,), allow_404=True)
          payload = {
              "tag_name": tag,
              "name": github.get("name") or f"ZzClawTerm {tag}",
              "body": (github.get("body") or "") + "\n\n---\n\n正在同步发行版附件。\n",
              "prerelease": str(bool(github.get("isPrerelease"))).lower(),
          }
          if existing:
              release_id = existing["id"]
              request("PATCH", f"{release_path}/{release_id}", data=payload)
          else:
              payload["target_commitish"] = github.get("targetCommitish") or ""
              created = request("POST", release_path, data=payload)
              release_id = created["id"]

          github_repo = os.environ["GITHUB_REPOSITORY"]

          def github_asset_url(name):
              return (
                  f"https://github.com/{github_repo}/releases/download/"
                  f"{urllib.parse.quote(tag, safe='')}/{urllib.parse.quote(name)}"
              )

          uploaded = []
          fallbacks = []

          for asset in assets:
              if not upload_small or asset.stat().st_size > max_bytes:
                  fallbacks.append((asset.name, github_asset_url(asset.name), "附件过大，从 GitHub Releases 下载"))
                  continue
              content_type = mimetypes.guess_type(asset.name)[0] or "application/octet-stream"
              success = False
              reason = ""
              for attempt in range(1, 4):
                  try:
                      with asset.open("rb") as handle:
                          response = session.post(
                              f"{api}{release_path}/{release_id}/attach_files",
                              params={"access_token": token},
                              files={"file": (asset.name, handle, content_type)},
                              data={"name": asset.name},
                              timeout=300,
                          )
                      if response.status_code in (200, 201):
                          success = True
                          break
                      lowered = response.text.lower()
                      if response.status_code in (400, 409, 422) and any(word in lowered for word in ("already", "exist", "duplicate", "已存在", "重复")):
                          success = True
                          break
                      if response.status_code in (401, 403, 404, 429):
                          print(f"::error::GitCode attachment API failed for {asset.name}: HTTP {response.status_code}")
                          print(response.text[:3000])
                          sys.exit(1)
                      reason = f"HTTP {response.status_code}: {response.text[:300]}"
                  except Exception as error:
                      reason = str(error)
                  if attempt < 3:
                      time.sleep(5 * attempt)
              if success:
                  uploaded.append(asset.name)
              else:
                  print(f"::warning::GitCode attachment failed for {asset.name}: {reason}")
                  fallbacks.append((asset.name, github_asset_url(asset.name), "GitCode 附件同步失败"))

          body = (github.get("body") or "").rstrip() + "\n\n---\n\n## 下载\n\n"
          if uploaded:
              body += "> 小于 GitCode 限制的安装包已同步到本页附件区。\n"
          if fallbacks:
              body += "\n### GitHub 备用下载\n\n"
              for name, url, reason in fallbacks:
                  body += f"- [{name}]({url})（{reason}）\n"
          payload["body"] = body
          request("PATCH", f"{release_path}/{release_id}", data=payload)
          print(f"GitCode release {tag}: {len(uploaded)} attachments, {len(fallbacks)} GitHub links")
          PY

      - name: Cleanup
        if: always()
        run: rm -rf release-assets github-release.json "${RUNNER_TEMP}/gitcode-release-venv"

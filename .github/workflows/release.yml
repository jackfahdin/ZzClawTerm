name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version; must match the Cargo workspace version
        required: false
        type: string
      upload_release:
        description: Publish GitHub and downstream release channels
        required: false
        default: false
        type: boolean
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # GitCode 的 HTTP 重定向会让 cargo 内置的 git2 传输在 Windows runner 上失败
  # (too many redirects or authentication replays)，改用系统 git 命令拉取 git 依赖。
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  # Download links in the generated manifests point at GitHub Releases assets.
  # TODO: a dedicated download mirror (previously Cloudflare R2) is planned but
  # not set up yet; restore it together with the site analytics work.
  DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve and validate release metadata
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPLOAD: ${{ inputs.upload_release }}
        run: |
          set -euo pipefail
          workspace_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          publish='false'
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            publish='true'
          else
            version="${INPUT_VERSION#v}"
            version="${version:-${workspace_version}}"
            tag="v${version}"
            if [[ "${INPUT_UPLOAD:-false}" == 'true' ]]; then
              [[ -n "${INPUT_VERSION:-}" ]] || {
                echo 'manual release publishing requires the version input' >&2
                exit 1
              }
              publish='true'
            fi
          fi
          python3 - "${version}" "${workspace_version}" <<'PY'
          import re
          import sys
          version, workspace = sys.argv[1:]
          semver = r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?"
          if not re.fullmatch(semver, version):
              raise SystemExit(f"invalid release version: {version}")
          if version != workspace:
              raise SystemExit(f"release version {version} does not match Cargo workspace version {workspace}")
          PY
          prerelease='false'
          [[ "${version}" == *-* ]] && prerelease='true'
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "publish=${publish}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify build configuration
        shell: bash
        env:
          ZZCLAWTERM_GITHUB_GIST_CLIENT_ID: ${{ vars.ZZCLAWTERM_GITHUB_GIST_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${ZZCLAWTERM_GITHUB_GIST_CLIENT_ID:-}" ]]; then
            echo '::warning::ZZCLAWTERM_GITHUB_GIST_CLIENT_ID is not set; the build will ship without GitHub Gist sync'
          fi

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-preflight
      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast
      - name: Test packaging and release helpers
        run: >-
          python -m unittest
          scripts.tests.test_check_release_assets
          scripts.tests.test_package_native
          scripts.tests.test_verify_native_package
          scripts.tests.test_generate_release_metadata
      - name: Check workflow syntax
        run: >-
          docker run --rm
          -v "${PWD}:/repo"
          -w /repo
          rhysd/actionlint:1.7.7

  package:
    name: Package ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: macos-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { label: macos-x64, os: macos-15-intel, target: x86_64-apple-darwin }
          # Keep the x64 glibc floor at 2.35 while ubuntu-22.04 is supported.
          - { label: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { label: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { label: windows-x64, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { label: windows-arm64, os: windows-2025, target: aarch64-pc-windows-msvc }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}
          cache-on-failure: 'true'
          save-cache: always
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps
        with:
          extra_packages: curl file patchelf desktop-file-utils dpkg-dev rpm
      - name: Install AppImage tooling
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/ci/install-appimagetool.sh "${TARGET}"
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-nsis.ps1
      - name: Package native application
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: ${{ runner.os == 'Linux' && '1' || '' }}
          ZZCLAWTERM_ARTIFACT_VERSION: ${{ needs.preflight.outputs.version }}
          ZZCLAWTERM_GITHUB_GIST_CLIENT_ID: ${{ vars.ZZCLAWTERM_GITHUB_GIST_CLIENT_ID }}
          ZZCLAWTERM_VERSION: ${{ needs.preflight.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: python scripts/release/package_native.py "${TARGET}"
      - name: Verify native package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          python scripts/release/verify_native_package.py
          --target "${TARGET}" --version "${VERSION}"
          --artifact-version "${VERSION}" --dist dist
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZzClawTerm-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [preflight, package]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ needs.preflight.outputs.version }}
      tag: ${{ needs.preflight.outputs.tag }}
      prerelease: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install signature verification tool
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ZzClawTerm-*
          path: dist-release
          merge-multiple: true
      - name: Validate release assets
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          python3 scripts/ci/check_release_assets.py --dist dist-release
          --version "${VERSION}" --artifact-version "${VERSION}"
      - name: Prepare release notes
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body // ""' > release-notes.md
            published_at="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json publishedAt --jq '.publishedAt')"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" -f target_commitish="${GITHUB_SHA}" --jq '.body // ""' > release-notes.md
            published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          echo "published_at=${published_at}" >> "${GITHUB_OUTPUT}"
      - name: Prepare updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_B64:-}" || -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]; then
            echo 'Tauri updater signing key and password are required' >&2
            exit 1
          fi
          key_text="$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY_B64}" | base64 --decode)"
          delimiter="TAURI_KEY_$(openssl rand -hex 12)"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<${delimiter}"
            printf '%s\n' "${key_text}"
            echo "${delimiter}"
          } >> "${GITHUB_ENV}"
      - name: Sign and verify legacy updater artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TAURI_UPDATER_PUBLIC_KEY_B64: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IENBM0E2Mzg3MzNGOUM3MDYKUldRR3gva3poMk02eXFGbGhobkVuaFVCZ0V2bnFheFRGQVlnVS9pSmFxRGc4WXNaMmZYeUZOM1cK
        run: |
          set -euo pipefail
          printf '%s' "${TAURI_UPDATER_PUBLIC_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/zzclawterm-updater.pub"
          files=(
            "dist-release/ZzClawTerm_${VERSION}_macos_arm64.app.tar.gz"
            "dist-release/ZzClawTerm_${VERSION}_macos_x64.app.tar.gz"
            "dist-release/ZzClawTerm_${VERSION}_linux_arm64.AppImage"
            "dist-release/ZzClawTerm_${VERSION}_linux_x64.AppImage"
            "dist-release/ZzClawTerm_${VERSION}_windows_arm64-setup.exe"
            "dist-release/ZzClawTerm_${VERSION}_windows_x64-setup.exe"
          )
          for file in "${files[@]}"; do
            npx --yes @tauri-apps/cli@2.10.0 signer sign --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" "${file}"
            # tauri signer 2.10 的 .sig 输出是 base64 包裹的整体 blob（直接供
            # latest.json 的 signature 字段使用），minisign 无法直接读；
            # 解码出标准 minisign 格式副本用于校验，原 .sig 保持不动。
            base64 --decode "${file}.sig" > "${RUNNER_TEMP}/verify.sig"
            minisign -Vm "${file}" -p "${RUNNER_TEMP}/zzclawterm-updater.pub" -x "${RUNNER_TEMP}/verify.sig"
          done
      - name: Generate checksums and manifests
        shell: bash
        env:
          BASE_URL: ${{ env.DOWNLOAD_BASE_URL }}
          PUB_DATE: ${{ steps.metadata.outputs.published_at }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release/generate_release_metadata.py \
            --dist dist-release --version "${VERSION}" --tag "${TAG}" \
            --base-url "${BASE_URL}" --notes-file release-notes.md --pub-date "${PUB_DATE}"
          rm -- dist-release/*.sig
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_id="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq '.databaseId')"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="ZzClawTerm ${TAG}" -F prerelease="${PRERELEASE}" >/dev/null
          else
            args=(release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "ZzClawTerm ${TAG}" --notes-file release-notes.md)
            [[ "${PRERELEASE}" == 'true' ]] && args+=(--prerelease)
            gh "${args[@]}"
          fi
          gh release upload "${TAG}" dist-release/* \
            --repo "${GITHUB_REPOSITORY}" --clobber

  # The Cloudflare R2 download-mirror job was removed: the bucket and public
  # base URL belonged to the original project. Manifests point at GitHub
  # Releases assets and the downloads.json / latest.json manifests ride
  # along as release assets.

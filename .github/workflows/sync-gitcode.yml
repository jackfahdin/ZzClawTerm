name: Sync to GitCode

on:
  workflow_run:
    workflows: ['Rust', 'Docs']
    types: [completed]
    branches: [master]

permissions:
  actions: read
  contents: read

concurrency:
  group: gitcode-mirror
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror refs to GitCode
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm Rust and Docs passed for the current master commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python3 scripts/ci/gitcode_mirror_gate.py master
          --repo "${GITHUB_REPOSITORY}" --sha "${HEAD_SHA}"

      - name: Push refs to GitCode
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${GITCODE_OWNER:-}" || -z "${GITCODE_REPO:-}" || -z "${GITCODE_TOKEN:-}" ]]; then
            echo "::notice::GITCODE_OWNER/GITCODE_REPO/GITCODE_TOKEN not configured; skipping GitCode mirror."
            exit 0
          fi
          remote="https://${GITCODE_OWNER}:${GITCODE_TOKEN}@gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}.git"
          git push "${remote}" "${HEAD_SHA}:refs/heads/master"

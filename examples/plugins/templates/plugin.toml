schema_version = 1
id = "shell-templates"
name = "Shell diagnostic templates"
version = "1.0.0"
authors = ["ZzClawTerm"]
description = "Declarative drafts; no Rust or Wasm required"
host_version = ">=0.1.0"
api_version = "1.0.0"

[[actions]]
id = "inspect"
name = "Inspect files"
description = "Draft a POSIX directory listing"
result = "command"
template = "templates/inspect.txt"
quoting = "posix"
[[actions.parameters]]
id = "path"
name = "Directory"
kind = "string"
required = true
default = "."
